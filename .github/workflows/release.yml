# Builds Voce for Apple Silicon Macs.
#
# Run it from the Actions tab ("Release", then "Run workflow"). It picks one of three modes:
# - notarized: all five Apple secrets are set. Signed with a Developer ID and
#   notarized, so macOS opens it without a warning.
# - self-signed: no Apple secrets, but the Voce signing certificate is set.
#   macOS blocks the first launch once (Privacy & Security, Open Anyway); the
#   signature stays the same across releases, so permissions survive updates.
# - rehearsal: neither. Builds without a signature and keeps it as a workflow
#   artifact only, so an unsigned build can never be published.
# Some but not all Apple secrets is an error.
#
# Both release modes upload the DMG and the updater files (latest.json and the
# signed .app.tar.gz) to a DRAFT release. Nobody sees a draft, and the in-app
# updater ignores it, until you press Publish on the release page. They run from
# main only, and stop if the version already has a release (draft or published)
# or a tag on another commit; they never delete or overwrite a release.
#
# The version comes from src-tauri/tauri.conf.json; bump it before each release.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater key (required)
#   APPLE_CERTIFICATE           Developer ID Application certificate, .p12 as base64
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_API_ISSUER            App Store Connect API key: issuer id
#   APPLE_API_KEY               App Store Connect API key: key id
#   APPLE_API_KEY_P8            App Store Connect API key: contents of the .p8 file
#   VOCE_SIGNING_CERT           self-signed "Voce Release Signing" certificate, .p12 as base64
#   VOCE_SIGNING_CERT_PASSWORD  password of that .p12

name: Release

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26 # Apple Silicon; the macOS 26 SDK is needed for the Apple Intelligence provider
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ALL: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
      APPLE_ANY: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_CERTIFICATE_PASSWORD != '' || secrets.APPLE_API_ISSUER != '' || secrets.APPLE_API_KEY != '' || secrets.APPLE_API_KEY_P8 != '' }}
      SELF_SIGNED: ${{ secrets.VOCE_SIGNING_CERT != '' && secrets.VOCE_SIGNING_CERT_PASSWORD != '' }}
      # SHA-1 of the self-signed certificate. macOS keys permissions to it, so a
      # different certificate would make every user grant them again.
      VOCE_CERT_SHA1: 075E722E512D2896F5E273528E846EBC5679AD0F
      BUNDLE: src-tauri/target/aarch64-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@v5

      - name: Pick the mode
        run: |
          if [ "$APPLE_ALL" = "true" ]; then MODE=notarized
          elif [ "$APPLE_ANY" = "true" ]; then
            echo "::error::Some Apple secrets are set but not all five. Set all of them or remove them."
            exit 1
          elif [ "$SELF_SIGNED" = "true" ]; then MODE=self-signed
          else MODE=rehearsal
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          [ "$MODE" = rehearsal ] && RELEASE=false || RELEASE=true
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Mode: $MODE"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Voce $VERSION ($MODE)"

      - name: Check the release can be created
        if: env.RELEASE == 'true'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are built from main only (this run is on $GITHUB_REF)."
            exit 1
          fi
          .github/scripts/release-guard.sh "${{ steps.version.outputs.tag }}" "$GITHUB_SHA"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Import the Developer ID certificate
        if: env.MODE == 'notarized'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # The certificate is self-signed, so macOS calls it untrusted; codesign
      # still signs with it when given its SHA-1.
      - name: Import the self-signed certificate
        if: env.MODE == 'self-signed'
        env:
          VOCE_SIGNING_CERT: ${{ secrets.VOCE_SIGNING_CERT }}
          VOCE_SIGNING_CERT_PASSWORD: ${{ secrets.VOCE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$VOCE_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$VOCE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          if ! security find-identity -p codesigning build.keychain | grep -q "$VOCE_CERT_SHA1"; then
            echo "::error::VOCE_SIGNING_CERT is not the Voce Release Signing certificate ($VOCE_CERT_SHA1)."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$VOCE_CERT_SHA1" >> "$GITHUB_ENV"

      - name: Set up notarization
        if: env.MODE == 'notarized'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
          } >> "$GITHUB_ENV"

      # The patched transcribe-cpp-sys (name boosting inside the stream).
      - name: Vendor transcribe-cpp-sys
        run: scripts/vendor-transcribe-cpp.sh

      # The cleanup sidecar: pinned llama.cpp release, checksum checked, only
      # llama-server and the dylibs it loads, signed here with the release
      # identity (Tauri does not sign macOS "files"; see the script).
      - name: Fetch llama-server
        run: |
          [ "$MODE" = notarized ] && export VOCE_SIGN_TIMESTAMP=1
          scripts/fetch-llama-server.sh

      # Tauri signs with APPLE_SIGNING_IDENTITY and notarizes when APPLE_API_*
      # is set; in a rehearsal neither is, so it builds unsigned.
      # Updater packages are switched on here only, so local builds need no updater key.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}' --config src-tauri/tauri.sidecar.conf.json

      # Runs in every mode: a sidecar dyld refuses (missing dylib, library
      # validation) fails the build here instead of on users' Macs.
      - name: Check the cleanup sidecar starts inside the app
        run: |
          set -euo pipefail
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name "*.app" | head -1)
          "$APP/Contents/MacOS/llama-server" --version

      - name: Check the signature
        if: env.RELEASE == 'true'
        run: |
          set -euo pipefail
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict "$APP"
          # The sidecar and every dylib it loads carry the release signature.
          for f in "$APP"/Contents/MacOS/llama-server "$APP"/Contents/MacOS/lib*.dylib; do
            codesign --verify --strict "$f"
            codesign -d -r- "$f" 2>&1 | tee "$RUNNER_TEMP/sidecar-requirement.txt"
            if [ "$MODE" = notarized ]; then
              TEAM=$(codesign -dv "$APP" 2>&1 | awk -F= '/^TeamIdentifier/{print $2}')
              codesign -dv "$f" 2>&1 | grep -qx "TeamIdentifier=$TEAM"
            else
              grep -qiE "certificate (root|leaf) = H\"$VOCE_CERT_SHA1\"" "$RUNNER_TEMP/sidecar-requirement.txt"
            fi
          done
          if [ "$MODE" = notarized ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$APP"
          else
            # Permissions follow the designated requirement; it must name this
            # certificate (a self-signed one is its own root, so codesign says "root").
            codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
            grep -qiE "certificate (root|leaf) = H\"$VOCE_CERT_SHA1\"" "$RUNNER_TEMP/requirement.txt"
          fi

      - name: Upload to a draft release
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name "*.dmg" | head -1)
          UPDATE=$(find "$BUNDLE/macos" -maxdepth 1 -name "*.app.tar.gz" | head -1)
          NAME=$(basename "$UPDATE" | tr ' ' '.')
          python3 - "$UPDATE.sig" "$NAME" <<'PY'
          import json, os, sys, datetime
          sig, name = open(sys.argv[1]).read().strip(), sys.argv[2]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}/{name}"
          json.dump({"version": os.environ["VERSION"],
                     "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "platforms": {"darwin-aarch64": {"signature": sig, "url": url}}},
                    open("latest.json", "w"), indent=2)
          PY
          # Checked again right before creating: the build takes a while.
          # The workflow never deletes or overwrites a release.
          .github/scripts/release-guard.sh "$TAG" "$GITHUB_SHA"
          NOTES="Download the .dmg below, open it, and drag Voce to Applications. Apple Silicon Macs, macOS 14.4 or later."
          if [ "$MODE" = self-signed ]; then
            NOTES="$NOTES

          The first time you open Voce, macOS says it cannot check the app for malicious software. Open System Settings, then Privacy & Security, scroll down and click Open Anyway. You only do this once; updates install on their own."
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Voce $TAG" \
            --notes "$NOTES" \
            "$DMG" "$UPDATE" "$UPDATE.sig" latest.json

      - name: Keep the rehearsal build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voce-${{ steps.version.outputs.version }}-unsigned
          path: |
            ${{ env.BUNDLE }}/dmg/*.dmg
            ${{ env.BUNDLE }}/macos/*.app.tar.gz
            ${{ env.BUNDLE }}/macos/*.app.tar.gz.sig
          retention-days: 7
